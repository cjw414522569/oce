services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${OCE_PORT:-8986}:8986"
    env_file:
      - .env
    environment:
      DB_URL: postgresql+asyncpg://oce:${POSTGRES_PASSWORD:-oce_dev}@postgres:5432/oce
      REDIS_URL: redis://:${REDIS_PASSWORD:-oce_dev}@redis:6379/0
      MILVUS_ENDPOINT: http://milvus:19530
      WORKER_ENABLED: "${WORKER_ENABLED:-true}"
      # 多用户门户静态资源（../oce-portal/dist，未启用 AUTH 时仅占用挂载点）
      AUTH_PORTAL_DIST_DIR: /app/portal-dist
    volumes:
      - ../oce-portal/dist:/app/portal-dist:ro
    # 宿主机上的 new-api 网关（3333）等本机服务经 host.docker.internal 访问
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "uv run alembic upgrade head && exec uv run uvicorn oce.main:app --host 0.0.0.0 --port 8986"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oce
      POSTGRES_USER: oce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oce_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oce -d oce"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-oce_dev}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-oce_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  minio:
    # 原 pinned tag RELEASE.2024-05-28T17-19-04Z 已从 registry 拉取不到（镜像源未收录），
    # 改用本机已有的 2025-09 版本；Milvus 只依赖其 S3 API。
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    # 2026-09-17 OOM 事故：无上限时 standalone 吃到 4.9GB（宿主共 7.9GB）被内核 OOM 杀，
    # 进入 929 次重启循环。cgroup 硬上限 + 写入水位线 + 内存瘦身三重防护。
    mem_limit: 4500m
    memswap_limit: 4500m
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # 提早封存：默认 1024MB×0.12≈123MB，改 256MB×0.5=128MB 即 seal 落 MinIO，降低常驻内存
      DATACOORD_SEGMENT_MAXSIZE: 256
      DATACOORD_SEGMENT_SEALPROPORTION: 0.5
      # growing 段 mmap：重写入期最大内存来源转由页缓存承载
      QUERYNODE_MMAP_GROWINGMMAPENABLED: "true"
      # HNSW 索引文件 mmap：索引页可被内核回收，显著降低常驻 RSS
      QUERYNODE_MMAP_VECTORINDEX: "true"
      # 关闭 growing/未索引段的临时索引（省内存，检索在该阶段退化为暴力扫描，可接受）
      QUERYNODE_SEGCORE_INTERIMINDEX_ENABLEINDEX: "false"
      # 关闭写入配额：8GB 宿主上配额分母（宿主 vs cgroup 总量）与实际 RSS 对不上，
      # 曾 0.55 水位线触发永久 force-deny 且 SDK 静默无限重试（worker 全挂起零日志）。
      # 内存越界交给 cgroup 4.5G 硬墙：只杀 milvus 自身、auto restart、数据持久层无恙
      QUOTAANDLIMITS_ENABLED: "false"
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      # Milvus 无内置鉴权，只绑定本机回环；app 经 compose 内部网络访问 milvus:19530
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 12
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
